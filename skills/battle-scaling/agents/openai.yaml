interface:
  display_name: "全自动论战"
  short_description: "汪吧／VSB战力评定与战斗写作，支持作者限定技能、过程和结局"
  default_prompt: "使用 $battle-scaling。单人、普通VS与故事版先执行同一独立角色研究：实际搜证、补链、比较高位候选，给一个综合主档与九维，说明为何落在此档；有子代理时独立处理各角色，先交报告与来源供主机实读。默认汪吧，明确要求时完整切换VSB。评级后才按所需呈现进入普通VS或完整战斗写作；恢复作者约束，保留原作人设、充分对白、合理前因、清楚交锋和优秀范例，不擅加设定。"
policy:
  allow_implicit_invocation: true
